[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet"
version = "0.0.1"
description = "Prophet — a next-generation LLM architecture designed for single-GPU training and consumer-hardware inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
conversion = [
    "transformers==5.17.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
]
gpu = [
    "fla-core==0.5.2; sys_platform == 'linux'",
]
train = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "wandb>=0.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["prophet*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
