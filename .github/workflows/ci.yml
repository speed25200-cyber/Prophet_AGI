name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m compileall -q prophet tests scripts
          ruff check \
            prophet/config.py prophet/data prophet/eval/__init__.py \
            prophet/eval/continual.py \
            prophet/memory/consolidate.py prophet/memory/ledger.py prophet/memory/session.py \
            prophet/modeling/layers.py prophet/modeling/model.py \
            prophet/train/checkpoint.py prophet/train/loop.py \
            prophet/train/loss.py scripts/build_data_docs.py scripts/verify_datasets.py \
            tests/test_config_budget.py tests/test_continual.py tests/test_data.py \
            tests/test_memory.py tests/test_modeling.py tests/test_tokenizer.py \
            tests/test_training.py
      - name: Tests
        run: python -m pytest -q
